# Tests the game headlessly, then builds unpacked desktop apps for Steam on
# every OS. Builds only: nothing is uploaded to Steam from here.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Strings present in every language, no overflow, no errors
        run: node test/i18n.mjs
      - name: Bot playtest (errors + balance)
        run: node test/playtest.mjs 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test/shots/

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win dir
          - os: macos-latest
            target: --mac dir
          - os: ubuntu-latest
            target: --linux dir
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: doorbuster-${{ runner.os }}
          path: |
            dist/*-unpacked/
            dist/mac*/
          if-no-files-found: error
